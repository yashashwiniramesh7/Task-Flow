<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Font Awesome -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- CSS -->

<link
rel="stylesheet"
href="css/calendar.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">

<div class="container">

<a class="navbar-brand logo"
href="index.html">

<i class="fa-solid fa-bolt"></i>
TaskFlow

</a>

<button
class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">

<span class="navbar-toggler-icon"></span>

</button>

<div
class="collapse navbar-collapse"
id="nav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link"
href="index.html">
Home
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="dashboard.html">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="analytics.html">
Analytics
</a>
</li>

<li class="nav-item">
<a class="nav-link active"
href="#">
Calendar
</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- PAGE -->

<div class="container py-5">

<h1 class="title">

Task Calendar

</h1>

<div class="row g-4">

<!-- CALENDAR -->

<div class="col-lg-8">

<div class="calendar-card">

<div class="calendar-header">

<button
id="prevBtn"
class="btn btn-neon">

<i class="fa-solid fa-chevron-left"></i>

</button>

<h3 id="monthYear">

Month Year

</h3>

<button
id="nextBtn"
class="btn btn-neon">

<i class="fa-solid fa-chevron-right"></i>

</button>

</div>

<div
class="weekdays">

<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>

</div>

<div
id="calendarDays"
class="calendar-grid">

</div>

</div>

</div>

<!-- UPCOMING TASKS -->

<div class="col-lg-4">

<div class="upcoming-card">

<h4>

Upcoming Deadlines

</h4>

<div
id="upcomingTasks">

</div>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->

<script src="js/calendar.js"></script>

</body>
</html>
