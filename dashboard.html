<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TaskFlow Dashboard</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- FontAwesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- CSS -->

<link rel="stylesheet"
href="css/dashboard.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">

<div class="container">

<a class="navbar-brand logo"
href="index.html">

<i class="fa-solid fa-bolt"></i>
TaskFlow

</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbar">

<span class="navbar-toggler-icon">
</span>

</button>

<div class="collapse navbar-collapse"
id="navbar">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link"
href="index.html">
Home
</a>
</li>

<li class="nav-item">
<a class="nav-link active"
href="#">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="analytics.html">
Analytics
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="calendar.html">
Calendar
</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- MAIN -->

<div class="container py-5">

<h1 class="title">

Task Dashboard

</h1>

<!-- SEARCH + FILTER -->

<div class="row mb-4">

<div class="col-md-6 mb-3">

<input
type="text"
id="searchInput"
class="form-control"
placeholder="Search Tasks...">

</div>

<div class="col-md-6">

<select
id="filterPriority"
class="form-select">

<option value="all">

All Priorities

</option>

<option value="High">

High

</option>

<option value="Medium">

Medium

</option>

<option value="Low">

Low

</option>

</select>

</div>

</div>

<!-- PROGRESS -->

<div class="progress-section">

<h5 class="mb-3">

Task Progress

</h5>

<div class="progress">

<div
id="progressBar"
class="progress-bar"
style="width:0%">

0%

</div>

</div>

</div>

<!-- ADD TASK BUTTON -->

<div class="text-center mb-4">

<button
class="btn btn-neon"

data-bs-toggle="modal"

data-bs-target="#taskModal">

+ Add New Task

</button>

</div>

<!-- TASKS -->

<div
id="taskList"
class="row g-4">

</div>

</div>

<!-- MODAL -->

<div class="modal fade"
id="taskModal">

<div class="modal-dialog">

<div class="modal-content custom-modal">

<div class="modal-header">

<h5 class="modal-title">

Create Task

</h5>

<button
type="button"
class="btn-close btn-close-white"

data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input
type="text"
id="taskInput"
class="form-control mb-3"
placeholder="Task Name">

<select
id="priority"
class="form-select mb-3">

<option value="High">

High Priority

</option>

<option value="Medium">

Medium Priority

</option>

<option value="Low">

Low Priority

</option>

</select>

<input
type="date"
id="dueDate"
class="form-control">

</div>

<div class="modal-footer">

<button
id="addTaskBtn"
class="btn btn-neon">

Add Task

</button>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->

<script src="js/dashboard.js"></script>

</body>
</html>
