<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TaskFlow Analytics</title>

<!-- Bootstrap -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Font Awesome -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- CSS -->

<link rel="stylesheet"
href="css/analytics.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark custom-nav">

<div class="container">

<a class="navbar-brand logo"
href="index.html">

<i class="fa-solid fa-bolt"></i>
TaskFlow

</a>

<button
class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">

<span class="navbar-toggler-icon">

</span>

</button>

<div
class="collapse navbar-collapse"
id="nav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link"
href="index.html">
Home
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="dashboard.html">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link active"
href="#">
Analytics
</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- PAGE TITLE -->

<div class="container py-5">

<h1 class="title">

Analytics Dashboard

</h1>

<!-- STATS -->

<div class="row g-4 mb-5">

<div class="col-md-3">

<div class="stat-card">

<i class="fa-solid fa-list-check"></i>

<h2 id="totalTasks">

0

</h2>

<p>Total Tasks</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<i class="fa-solid fa-circle-check"></i>

<h2 id="completedTasks">

0

</h2>

<p>Completed</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<i class="fa-solid fa-clock"></i>

<h2 id="pendingTasks">

0

</h2>

<p>Pending</p>

</div>

</div>

<div class="col-md-3">

<div class="stat-card">

<i class="fa-solid fa-chart-line"></i>

<h2 id="successRate">

0%

</h2>

<p>Success Rate</p>

</div>

</div>

</div>

<!-- CHARTS -->

<div class="row g-4">

<div class="col-lg-6">

<div class="chart-card">

<h4>

Task Completion

</h4>

<canvas
id="completionChart">

</canvas>

</div>

</div>

<div class="col-lg-6">

<div class="chart-card">

<h4>

Priority Analysis

</h4>

<canvas
id="priorityChart">

</canvas>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS -->

<script src="js/analytics.js"></script>

</body>
</html>
