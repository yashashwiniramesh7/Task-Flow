TaskFlow

<button
class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">

<div
class="collapse navbar-collapse"
id="nav">

<ul class="navbar-nav ms-auto">

</ul>

<!-- PAGE -->

<div class="container py-5">

<h1 class="title">

Contact & Settings

</h1>

<div class="row g-4">

<!-- CONTACT FORM -->

<div class="col-lg-7">

<div class="card-box">

<h3>Contact Us</h3>

<form id="contactForm">

<input
type="text"
class="form-control mb-3"
placeholder="Your Name"
required>

<input
type="email"
class="form-control mb-3"
placeholder="Email Address"
required>

<textarea
class="form-control mb-3"
rows="6"
placeholder="Your Message"
required>

</textarea>

<button
type="submit"
class="btn btn-neon">

Send Message

</button>

</form>

</div>

</div>

<!-- SETTINGS -->

<div class="col-lg-5">

<div class="card-box">

<h3>Settings</h3>

<!-- Theme -->

<div class="setting-item">

<label>

Dark Mode

</label>

<input
type="checkbox"
id="themeToggle">

</div>

<!-- Notifications -->

<div class="setting-item">

<label>

Email Notifications

</label>

<input
type="checkbox"
id="emailToggle">

</div>

<div class="setting-item">

<label>

Deadline Alerts

</label>

<input
type="checkbox"
id="alertToggle">

</div>

<button
id="saveSettings"
class="btn btn-neon mt-3 w-100">

Save Preferences

</button>

</div>

</div>

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->

<script src="js/contact.js"></script>

</body>
